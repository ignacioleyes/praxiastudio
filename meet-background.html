<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Praxia Studio · Meet Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0a0a0d;
    font-family: "Inter Tight", system-ui, sans-serif;
    color: #f5f5f8;
    position: relative;
  }

  /* Ambient radial lighting */
  .ambient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 700px at 75% 30%, rgba(139, 92, 246, 0.22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 20% 80%, rgba(233, 30, 140, 0.18), transparent 60%);
  }

  /* Grid pattern overlay */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.035;
  }

  /* Decorative iso huge in background */
  .iso-decorative {
    position: absolute;
    right: -100px;
    top: 50%;
    transform: translateY(-50%);
    width: 900px;
    height: 900px;
    opacity: 0.06;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* Brand bottom-left */
  .brand {
    position: absolute;
    bottom: 80px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .brand-iso { width: 100px; height: 100px; }
  .brand-text h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1;
    margin-bottom: 12px;
  }
  .brand-text h1 .accent {
    background: linear-gradient(135deg, #8b5cf6 0%, #e91e8c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-text .tag {
    font-size: 18px;
    color: rgba(245, 245, 248, 0.55);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .brand-text .url {
    font-size: 14px;
    color: rgba(245, 245, 248, 0.4);
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Top-right accent (subtle decoration) */
  .accent-corner {
    position: absolute;
    top: 60px;
    right: 80px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: rgba(245, 245, 248, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.25em;
    font-weight: 600;
  }
  .accent-corner .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #e91e8c);
    box-shadow: 0 0 12px rgba(233, 30, 140, 0.6);
  }
</style>
</head>
<body>
  <!-- Background layers -->
  <div class="ambient"></div>
  <div class="grid"></div>

  <!-- Big decorative iso behind -->
  <svg class="iso-decorative" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-dec" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#e91e8c"/>
      </linearGradient>
    </defs>
    <polygon points="50,18 35,38 65,38" fill="url(#g-dec)"/>
    <polygon points="50,42 28,72 72,72" fill="url(#g-dec)" opacity="0.7"/>
    <polygon points="50,68 18,98 82,98" fill="url(#g-dec)" opacity="0.4"/>
  </svg>

  <div class="vignette"></div>

  <!-- Top-right: studio status -->
  <div class="accent-corner">
    <span class="dot"></span>
    <span>Studio · Salta, Argentina</span>
  </div>

  <!-- Brand bottom-left -->
  <div class="brand">
    <svg class="brand-iso" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g-brand" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#e91e8c"/>
        </linearGradient>
      </defs>
      <polygon points="50,18 35,38 65,38" fill="url(#g-brand)"/>
      <polygon points="50,42 28,72 72,72" fill="url(#g-brand)" opacity="0.7"/>
      <polygon points="50,68 18,98 82,98" fill="url(#g-brand)" opacity="0.4"/>
    </svg>
    <div class="brand-text">
      <h1>Praxia <span class="accent">Studio</span></h1>
      <div class="tag">Software puesto en acción</div>
      <div class="url">praxiastudio.ar</div>
    </div>
  </div>
</body>
</html>
